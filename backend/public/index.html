<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MS TV Admin</title>
  <style>
    :root{
      --bg:#eef2f7;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --sidebar1:#071226;
      --sidebar2:#0f172a;
      --green:#16a34a;
      --green-soft:#dcfce7;
      --blue:#2563eb;
      --blue-soft:#dbeafe;
      --red:#dc2626;
      --red-soft:#fee2e2;
      --purple:#7c3aed;
      --purple-soft:#ede9fe;
      --gray:#475569;
      --gray-soft:#f1f5f9;
      --shadow:0 12px 30px rgba(15,23,42,.08);
      --shadow-soft:0 6px 18px rgba(15,23,42,.06);
      --radius:22px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#f8fafc 0%, #eef2f7 100%);
      color:var(--text);
    }

    .layout{
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:300px;
      background:linear-gradient(180deg,var(--sidebar1) 0%,var(--sidebar2) 100%);
      color:#fff;
      padding:24px 18px;
      box-shadow:4px 0 18px rgba(0,0,0,.08);
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
    }

    .avatar-box{
      display:flex;
      justify-content:center;
      margin-bottom:18px;
    }

    .avatar-frame{
      width:170px;
      height:170px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:transparent;
      box-shadow:0 10px 28px rgba(0,0,0,.28);
    }

    .avatar-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
      background:transparent;
    }

    .brand{
      margin-bottom:22px;
      text-align:center;
    }

    .brand h1{
      margin:0;
      font-size:34px;
      line-height:1;
      font-weight:800;
      letter-spacing:-1px;
    }

    .brand p{
      margin:10px 0 0;
      color:#cbd5e1;
      font-size:14px;
      line-height:1.45;
    }

    .menu-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:1px;
      color:#94a3b8;
      margin:18px 0 10px;
      padding-left:8px;
    }

    .nav-btn{
      width:100%;
      border:none;
      background:transparent;
      color:#e5e7eb;
      text-align:left;
      padding:14px 16px;
      border-radius:14px;
      margin-bottom:10px;
      cursor:pointer;
      font-size:15px;
      font-weight:700;
      transition:all .2s ease;
    }

    .nav-btn:hover{
      background:rgba(255,255,255,.08);
      transform:translateX(4px);
    }

    .nav-btn.active{
      background:#fff;
      color:#111827;
      box-shadow:0 10px 18px rgba(255,255,255,.08);
    }

    .sidebar-footer{
      margin-top:26px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      color:#cbd5e1;
      font-size:13px;
      line-height:1.5;
    }

    .main{
      flex:1;
      padding:26px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:22px;
    }

    .topbar h2{
      margin:0;
      font-size:30px;
      letter-spacing:-.4px;
    }

    .topbar p{
      margin:6px 0 0;
      color:var(--muted);
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:11px 16px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
      box-shadow:var(--shadow-soft);
    }

    .btn:hover{
      opacity:.96;
      transform:translateY(-1px);
    }

    .btn-dark{background:#111827;color:#fff}
    .btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
    .btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}

    .grid{
      display:grid;
      gap:16px;
    }

    .cards{
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      margin-bottom:22px;
    }

    .card{
      background:var(--card);
      border:1px solid rgba(226,232,240,.9);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:var(--shadow);
    }

    .card-title{
      color:var(--muted);
      font-size:14px;
      font-weight:700;
    }

    .card-value{
      font-size:36px;
      font-weight:900;
      margin-top:10px;
      letter-spacing:-1px;
    }

    .two-cols{
      display:grid;
      grid-template-columns:1.45fr .95fr;
      gap:18px;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .filters{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .filters > *{
      width:auto;
      min-width:170px;
    }

    input, select, textarea{
      width:100%;
      border:1px solid #dbe2ea;
      border-radius:14px;
      padding:12px 13px;
      font-size:14px;
      outline:none;
      background:#fff;
      transition:.2s;
    }

    input:focus, select:focus, textarea:focus{
      border-color:#3b82f6;
      box-shadow:0 0 0 4px rgba(59,130,246,.10);
    }

    textarea{
      min-height:130px;
      resize:vertical;
    }

    .actions-bar{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:12px 0 8px;
    }

    .notice{
      color:var(--muted);
      font-size:12px;
      margin-bottom:12px;
    }

    .table-shell{
      border:1px solid #dbe4ee;
      border-radius:24px;
      overflow:hidden;
      background:#fff;
      box-shadow:var(--shadow);
    }

    .table-wrap{
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:1100px;
    }

    thead th{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:#f8fafc;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.7px;
      font-weight:800;
      padding:16px 16px;
      border-bottom:none;
      position:sticky;
      top:0;
      z-index:2;
    }

    thead th:first-child{
      border-top-left-radius:18px;
    }

    thead th:last-child{
      border-top-right-radius:18px;
    }

    tbody td{
      padding:18px 16px;
      border-bottom:1px solid #eef2f7;
      font-size:14px;
      vertical-align:top;
      background:#fff;
      transition:.18s ease;
    }

    tbody tr:nth-child(even) td{
      background:#fcfdff;
    }

    tbody tr:hover td{
      background:#f8fbff;
    }

    tbody tr:last-child td{
      border-bottom:none;
    }

    .login-cell{
      font-weight:800;
      color:#0f172a;
      font-size:15px;
    }

    .date-cell{
      font-weight:700;
      color:#1e293b;
    }

    .conn-cell{
      font-weight:800;
      color:#334155;
    }

    .badge{
      display:inline-block;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.2px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);
    }

    .badge-ativo{background:var(--green-soft);color:#15803d}
    .badge-teste{background:var(--blue-soft);color:#1d4ed8}
    .badge-vencido{background:var(--red-soft);color:#b91c1c}
    .badge-pago{background:var(--purple-soft);color:#6d28d9}

    .table-actions{
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:340px;
    }

    .contact-card{
      width:100%;
      background:linear-gradient(180deg,#f8fafc 0%, #f1f5f9 100%);
      border:1px solid #e2e8f0;
      border-radius:18px;
      padding:14px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
    }

    .contact-label{
      display:block;
      font-size:11px;
      font-weight:900;
      color:#64748b;
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:.9px;
    }

    .contact-view{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .saved-phone{
      font-size:15px;
      color:#0f172a;
      font-weight:900;
      background:#fff;
      border:1px solid #e2e8f0;
      padding:11px 13px;
      border-radius:14px;
      box-shadow:var(--shadow-soft);
    }

    .contact-row{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .input-whatsapp{
      flex:1;
      min-width:185px;
      border:1px solid #dbe2ea;
      border-radius:14px;
      padding:12px 13px;
      font-size:14px;
      background:#fff;
      transition:.2s;
      color:#111827;
    }

    .input-whatsapp:focus{
      border-color:#22c55e;
      outline:none;
      box-shadow:0 0 0 4px rgba(34,197,94,.12);
    }

    .action-buttons{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .mini-btn{
      border:none;
      padding:11px 14px;
      border-radius:14px;
      cursor:pointer;
      font-size:13px;
      font-weight:800;
      text-decoration:none;
      color:#111827;
      transition:.2s;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      box-shadow:var(--shadow-soft);
    }

    .mini-btn:hover{
      transform:translateY(-1px);
      opacity:.96;
    }

    .mini-btn.outline{
      background:#fff;
      border:1px solid #d1d5db;
      color:#111827;
    }

    .mini-btn.blue{
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      color:#fff;
    }

    .mini-btn.green{
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff;
    }

    .mini-btn.gray{
      background:linear-gradient(135deg,#6b7280,#4b5563);
      color:#fff;
    }

    .mini-btn.red{
      background:linear-gradient(135deg,#ef4444,#dc2626);
      color:#fff;
    }

    .small-card{
      padding:14px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      margin-bottom:12px;
    }

    .small-card strong{
      display:block;
      margin-bottom:5px;
    }

    .muted{
      color:var(--muted);
    }

    .charge-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:16px;
    }

    .charge-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .charge-list{
      margin-top:10px;
      max-height:320px;
      overflow:auto;
      border-top:1px solid #f1f5f9;
      padding-top:10px;
    }

    .charge-item{
      padding:10px 0;
      border-bottom:1px solid #f8fafc;
      font-size:14px;
    }

    .promo-box, .raffle-box{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
      box-shadow:var(--shadow);
    }

    .result-box{
      margin-top:14px;
      padding:16px;
      border-radius:16px;
      background:#f8fafc;
      border:1px dashed #cbd5e1;
      font-weight:700;
    }

    .empty{
      color:var(--muted);
      padding:22px 0;
      text-align:center;
      font-weight:700;
    }

    @media (max-width: 980px){
      .layout{flex-direction:column}
      .sidebar{
        width:100%;
        height:auto;
        position:relative;
      }
      .main{padding:18px}
      .two-cols{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="avatar-box">
        <div class="avatar-frame">
          <img src="/avatar-ms-tv.png" alt="Avatar MS TV">
        </div>
      </div>

      <div class="brand">
        <h1>MS TV</h1>
        <p>Painel de clientes, cobranças, promoções e sorteio mensal.</p>
      </div>

      <div class="menu-title">Principal</div>

      <button class="nav-btn active" onclick="changeScreen('dashboard', this)">📊 Dashboard</button>
      <button class="nav-btn" onclick="changeScreen('clientes', this)">👥 Clientes</button>
      <button class="nav-btn" onclick="changeScreen('cobrancas', this)">💬 Cobranças WhatsApp</button>
      <button class="nav-btn" onclick="changeScreen('financeiro', this)">💰 Financeiro</button>
      <button class="nav-btn" onclick="changeScreen('promocao', this)">🎁 Promoção do dia</button>
      <button class="nav-btn" onclick="changeScreen('sorteio', this)">🎉 Sorteio do mês</button>

      <div class="sidebar-footer">
        WhatsApp oficial da MS TV:<br>
        <strong>(62) 9 9113-3110</strong>
      </div>
    </aside>

    <main class="main">
      <div id="app"></div>
    </main>
  </div>

  <script>
    const API = window.location.origin;
    const VALOR_MENSAL = 30;

    let screen = "dashboard";
    let clientes = [];
    let pagos = [];
    let contatos = {};
    let filtroBusca = "";
    let filtroStatus = "";
    let editandoContato = {};

    function changeScreen(nextScreen, button) {
      screen = nextScreen;
      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
      if (button) button.classList.add("active");
      render();
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error("Falha ao carregar " + url);
      return res.json();
    }

    function parseBrDate(dateStr) {
      if (!dateStr || !dateStr.includes("/")) return null;
      const [day, month, year] = dateStr.split("/").map(Number);
      return new Date(year, month - 1, day, 12, 0, 0);
    }

    function diffDays(dateStr) {
      const d = parseBrDate(dateStr);
      if (!d) return null;
      const now = new Date();
      const startA = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const startB = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.floor((startA - startB) / (1000 * 60 * 60 * 24));
    }

    function isPago(id) {
      return pagos.includes(id);
    }

    function statusLabel(cliente) {
      if (isPago(cliente.id)) return "Pago";
      return cliente.status === "ativo" ? "Ativo" :
             cliente.status === "teste" ? "Teste" :
             cliente.status === "vencido" ? "Vencido" : "Inativo";
    }

    function statusBadgeClass(cliente) {
      if (isPago(cliente.id)) return "badge badge-pago";
      if (cliente.status === "ativo") return "badge badge-ativo";
      if (cliente.status === "teste") return "badge badge-teste";
      if (cliente.status === "vencido") return "badge badge-vencido";
      return "badge badge-vencido";
    }

    function sortClientes(list) {
      return [...list].sort((a, b) => {
        const aPago = isPago(a.id);
        const bPago = isPago(b.id);
        if (aPago !== bPago) return aPago ? 1 : -1;

        const da = parseBrDate(a.vencimento);
        const db = parseBrDate(b.vencimento);

        if (!da && !db) return (a.login || "").localeCompare(b.login || "");
        if (!da) return 1;
        if (!db) return -1;

        return da - db;
      });
    }

    function clientesFiltrados() {
      let lista = sortClientes(clientes);

      if (filtroBusca.trim()) {
        const q = filtroBusca.trim().toLowerCase();
        lista = lista.filter(c => (c.login || "").toLowerCase().includes(q));
      }

      if (filtroStatus === "pago") {
        lista = lista.filter(c => isPago(c.id));
      } else if (filtroStatus) {
        lista = lista.filter(c => !isPago(c.id) && c.status === filtroStatus);
      }

      return lista;
    }

    function clientesPorDias(days) {
      return sortClientes(clientes).filter(c => {
        if (isPago(c.id)) return false;
        const d = diffDays(c.vencimento);
        return d === days;
      });
    }

    function clientesVencidos() {
      return sortClientes(clientes).filter(c => !isPago(c.id) && c.status === "vencido");
    }

    function clientesEmDiaParaSorteio() {
      return clientes.filter(c => isPago(c.id) && c.status !== "vencido");
    }

    async function carregar(forceSync = true) {
      try {
        const rota = forceSync ? "/api/clients/sync" : "/api/clients";
        const data = await fetchJson(API + rota);
        clientes = data.clients || [];

        const pagosRes = await fetchJson(API + "/api/clients/pagos");
        pagos = pagosRes || [];

        const contatosRes = await fetchJson(API + "/api/clients/contatos");
        contatos = contatosRes || {};

        render();
      } catch (error) {
        console.error("Erro ao carregar clientes:", error);
        clientes = [];
        render();
      }
    }

    async function marcarPago(id) {
      try {
        await fetchJson(API + "/api/clients/pagar/" + id, { method: "POST" });
        if (!pagos.includes(id)) pagos.push(id);
        render();
      } catch (error) {
        alert("Erro ao marcar como pago.");
      }
    }

    async function desmarcarPago(id) {
      try {
        await fetchJson(API + "/api/clients/desmarcar-pago/" + id, { method: "POST" });
        pagos = pagos.filter(item => item !== id);
        render();
      } catch (error) {
        alert("Erro ao desmarcar pagamento.");
      }
    }

    function abrirEdicaoContato(id) {
      editandoContato[id] = true;
      renderClientes();
    }

    function cancelarEdicaoContato(id) {
      delete editandoContato[id];
      renderClientes();
    }

    async function salvarContato(id) {
      const input = document.getElementById("fone_" + id);
      const telefone = input.value.trim();

      if (!telefone) {
        alert("Digite o WhatsApp do cliente.");
        return;
      }

      try {
        await fetchJson(API + "/api/clients/contatos/" + id, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ telefone })
        });

        contatos[id] = telefone.replace(/\D/g, "");
        delete editandoContato[id];
        renderClientes();
      } catch (error) {
        alert("Erro ao salvar contato.");
        console.error(error);
      }
    }

    function buildClientWhatsappLink(cliente, text) {
      const numero = contatos[cliente.id];

      if (!numero) {
        alert("Cadastre o WhatsApp do cliente primeiro.");
        return "#";
      }

      const numeroCompleto = numero.startsWith("55") ? numero : "55" + numero;
      return `https://wa.me/${numeroCompleto}?text=${encodeURIComponent(text)}`;
    }

    function textoCobranca(cliente, tipo) {
      const login = cliente.login;
      const data = cliente.vencimento;

      if (tipo === "3") {
        return `Olá, tudo bem? 😊

Passando para avisar que sua assinatura MS TV (login: ${login}) vence em breve, no dia ${data}.

Agradecemos muito por fazer parte da nossa plataforma 🙌
Você é muito importante para toda a equipe MS TV.

Se desejar, já posso te enviar o PIX para renovação.

Equipe MS TV 💙`;
      }

      if (tipo === "2") {
        return `Olá! Tudo bem? 😊

Sua assinatura MS TV (login: ${login}) vence em 2 dias, na data ${data}.

Queremos garantir que você continue aproveitando a melhor experiência com a MS TV sem interrupções.

Se quiser, já posso te enviar o PIX para renovação.

Equipe MS TV 💙`;
      }

      if (tipo === "1") {
        return `Olá! Tudo bem? 😊

Sua assinatura MS TV (login: ${login}) vence amanhã (${data}).

Para evitar qualquer interrupção no seu acesso, já podemos adiantar sua renovação.

Agradecemos por confiar no nosso serviço 🙌
Equipe MS TV 💙`;
      }

      if (tipo === "0") {
        return `Olá! 😊

Sua assinatura MS TV (login: ${login}) vence hoje (${data}).

Para continuar aproveitando sua programação sem interrupções, já posso te enviar o PIX para renovação.

Você é muito importante para nós 💙
Equipe MS TV`;
      }

      return `Olá! 😊

Identificamos que sua assinatura MS TV (login: ${login}) venceu no dia ${data}.

Caso deseje reativar, posso te enviar o PIX agora mesmo.

Sentimos sua falta na plataforma 💙
Equipe MS TV`;
    }

    function cobrarLista(lista, tipo) {
      const clientesComNumero = lista.filter(cliente => contatos[cliente.id]);

      if (!clientesComNumero.length) {
        alert("Nenhum cliente com WhatsApp cadastrado nessa faixa.");
        return;
      }

      clientesComNumero.forEach((cliente, index) => {
        const link = buildClientWhatsappLink(cliente, textoCobranca(cliente, tipo));
        setTimeout(() => {
          window.open(link, "_blank");
        }, index * 300);
      });
    }

    function enviarPromocaoMassa() {
      const msg = document.getElementById("promoMsg").value.trim();

      if (!msg) {
        alert("Digite a mensagem da promoção.");
        return;
      }

      const clientesComNumero = clientes.filter(cliente => contatos[cliente.id]);

      if (!clientesComNumero.length) {
        alert("Nenhum cliente com WhatsApp cadastrado.");
        return;
      }

      clientesComNumero.forEach((cliente, index) => {
        const text = `🔥 PROMOÇÃO DO DIA MS TV 🔥

Olá, ${cliente.login}!

${msg}

Aproveite agora e garanta o melhor do entretenimento com a MS TV 🚀

Equipe MS TV 💙`;

        const link = buildClientWhatsappLink(cliente, text);

        setTimeout(() => {
          window.open(link, "_blank");
        }, index * 250);
      });
    }

    function sortearCliente() {
      const elegiveis = clientesEmDiaParaSorteio();
      const box = document.getElementById("raffleResult");

      if (!elegiveis.length) {
        box.innerHTML = "Nenhum cliente elegível para sorteio.";
        return;
      }

      const escolhido = elegiveis[Math.floor(Math.random() * elegiveis.length)];
      box.innerHTML = `🎉 GANHADOR DO MÊS 🎉<br><br>Cliente: <strong>${escolhido.login}</strong><br>Parabéns! Você ganhou 1 mês grátis na MS TV 💙`;
    }

    function renderDashboard() {
      const ativos = clientes.filter(c => c.status === "ativo").length;
      const vencidos = clientes.filter(c => c.status === "vencido").length;
      const testes = clientes.filter(c => c.status === "teste").length;
      const receitaBruta = pagos.length * VALOR_MENSAL;
      const em3 = clientesPorDias(3).length;
      const em2 = clientesPorDias(2).length;
      const em1 = clientesPorDias(1).length;
      const hoje = clientesPorDias(0).length;

      app.innerHTML = `
        <div class="topbar">
          <div>
            <h2>Dashboard</h2>
            <p>Resumo geral do painel MS TV.</p>
          </div>
          <button class="btn btn-dark" onclick="carregar(true)">Atualizar agora</button>
        </div>

        <section class="grid cards">
          <div class="card"><div class="card-title">Clientes</div><div class="card-value">${clientes.length}</div></div>
          <div class="card"><div class="card-title">Ativos</div><div class="card-value">${ativos}</div></div>
          <div class="card"><div class="card-title">Vencidos</div><div class="card-value">${vencidos}</div></div>
          <div class="card"><div class="card-title">Testes</div><div class="card-value">${testes}</div></div>
          <div class="card"><div class="card-title">Receita bruta do mês</div><div class="card-value">R$ ${receitaBruta.toFixed(2).replace(".", ",")}</div></div>
        </section>

        <section class="two-cols">
          <div class="card">
            <h3 style="margin-top:0">Cobranças por vencimento</h3>
            <div class="actions-bar">
              <button class="btn btn-green" onclick="cobrarLista(clientesPorDias(3), '3')">Cobrar em 3 dias (${em3})</button>
              <button class="btn btn-green" onclick="cobrarLista(clientesPorDias(2), '2')">Cobrar em 2 dias (${em2})</button>
              <button class="btn btn-green" onclick="cobrarLista(clientesPorDias(1), '1')">Cobrar em 1 dia (${em1})</button>
              <button class="btn btn-red" onclick="cobrarLista(clientesPorDias(0), '0')">Cobrar hoje (${hoje})</button>
            </div>
            <p class="notice">Sincronização ao clicar em “Atualizar agora”. Clientes pagos vão para o final da lista.</p>
          </div>

          <div class="card">
            <h3 style="margin-top:0">Sorteio do mês</h3>
            <p class="muted">Participam os clientes marcados como pagos e que não estejam vencidos.</p>
            <div class="small-card"><strong>Elegíveis no momento:</strong> ${clientesEmDiaParaSorteio().length}</div>
          </div>
        </section>
      `;
    }

    function renderClientes() {
      const lista = clientesFiltrados();

      app.innerHTML = `
        <div class="topbar">
          <div>
            <h2>Clientes</h2>
            <p>Lista completa, ordenada por vencimento.</p>
          </div>
          <button class="btn btn-dark" onclick="carregar(true)">Atualizar agora</button>
        </div>

        <div class="card">
          <div class="toolbar">
            <div>
              <h3 style="margin:0">Clientes sincronizados</h3>
              <p class="muted" style="margin:6px 0 0">Cadastre o WhatsApp para cobrança e promoções diretas.</p>
            </div>

            <div class="filters">
              <input id="searchInput" placeholder="Buscar login" value="${filtroBusca}">
              <select id="statusSelect">
                <option value="" ${filtroStatus === "" ? "selected" : ""}>Todos</option>
                <option value="ativo" ${filtroStatus === "ativo" ? "selected" : ""}>Ativo</option>
                <option value="teste" ${filtroStatus === "teste" ? "selected" : ""}>Teste</option>
                <option value="vencido" ${filtroStatus === "vencido" ? "selected" : ""}>Vencido</option>
                <option value="pago" ${filtroStatus === "pago" ? "selected" : ""}>Pagos</option>
              </select>
            </div>
          </div>

          <div class="table-shell">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Login</th>
                    <th>Vencimento</th>
                    <th>Status</th>
                    <th>Conexões</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  ${
                    lista.length
                      ? lista.map(c => `
                        <tr>
                          <td class="login-cell">${c.login}</td>
                          <td class="date-cell">${c.vencimento || "-"}</td>
                          <td><span class="${statusBadgeClass(c)}">${statusLabel(c)}</span></td>
                          <td class="conn-cell">${Number(c.conexoesAtuais || 0)}/${Number(c.maxConexoes || 0)}</td>
                          <td>
                            <div class="table-actions">
                              <div class="contact-card">
                                <span class="contact-label">WhatsApp do cliente</span>

                                ${
                                  contatos[c.id] && !editandoContato[c.id]
                                    ? `
                                      <div class="contact-view">
                                        <div class="saved-phone">${contatos[c.id]}</div>
                                        <button class="mini-btn gray" onclick="abrirEdicaoContato('${c.id}')">Editar</button>
                                      </div>
                                    `
                                    : `
                                      <div class="contact-row">
                                        <input
                                          id="fone_${c.id}"
                                          class="input-whatsapp"
                                          placeholder="Ex: 62999999999"
                                          value="${contatos[c.id] || ""}"
                                        >
                                        <button class="mini-btn green" onclick="salvarContato('${c.id}')">Salvar</button>
                                        ${
                                          contatos[c.id]
                                            ? `<button class="mini-btn outline" onclick="cancelarEdicaoContato('${c.id}')">Cancelar</button>`
                                            : ""
                                        }
                                      </div>
                                    `
                                }
                              </div>

                              <div class="action-buttons">
                                <a
                                  class="mini-btn outline"
                                  target="_blank"
                                  href="${contatos[c.id] ? buildClientWhatsappLink(c, `Olá, tudo bem? Sua assinatura MS TV (${c.login}) vence em ${c.vencimento}. Caso queira, posso te enviar o PIX para renovação.`) : '#'}"
                                  onclick="${contatos[c.id] ? "" : "alert('Cadastre o WhatsApp do cliente primeiro.'); return false;"}"
                                >
                                  WhatsApp
                                </a>

                                ${
                                  isPago(c.id)
                                    ? `<button class="mini-btn red" onclick="desmarcarPago('${c.id}')">Desmarcar pago</button>`
                                    : `<button class="mini-btn blue" onclick="marcarPago('${c.id}')">Marcar pago</button>`
                                }
                              </div>
                            </div>
                          </td>
                        </tr>
                      `).join("")
                      : `<tr><td colspan="5" class="empty">Nenhum cliente encontrado.</td></tr>`
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById("searchInput").addEventListener("input", (e) => {
        filtroBusca = e.target.value;
        renderClientes();
      });

      document.getElementById("statusSelect").addEventListener("change", (e) => {
        filtroStatus = e.target.value;
        renderClientes();
      });
    }

    function renderCobrancas() {
      const lista3 = clientesPorDias(3);
      const lista2 = clientesPorDias(2);
      const lista1 = clientesPorDias(1);
      const listaHoje = clientesPorDias(0);
      const listaVencidos = clientesVencidos();

      function bloco(titulo, subtitulo, lista, tipoRef, tipoTexto) {
        window[tipoRef] = lista;

        return `
          <div class="charge-card">
            <h3 style="margin:0">${titulo}</h3>
            <p>${subtitulo}</p>
            <button class="btn btn-green" onclick="cobrarLista(window.${tipoRef}, '${tipoTexto}')">Enviar cobrança</button>
            <div class="charge-list">
              ${lista.length ? lista.map(c => `
                <div class="charge-item">
                  <strong>${c.login}</strong><br>
                  <span class="muted">Vencimento: ${c.vencimento}</span>
                </div>
              `).join("") : `<div class="empty">Nenhum cliente nesta faixa.</div>`}
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="topbar">
          <div>
            <h2>Cobranças WhatsApp</h2>
            <p>Blocos separados por vencimento com mensagens profissionais.</p>
          </div>
          <button class="btn btn-dark" onclick="carregar(true)">Atualizar agora</button>
        </div>

        <div class="charge-grid">
          ${bloco("Vence em 3 dias", "Cobrança preventiva", lista3, "lista3", "3")}
          ${bloco("Vence em 2 dias", "Lembrete antecipado", lista2, "lista2", "2")}
          ${bloco("Vence em 1 dia", "Lembrete de vencimento", lista1, "lista1", "1")}
          ${bloco("Vence hoje", "Cobrança do dia", listaHoje, "lista0", "0")}
          ${bloco("Vencidos", "Clientes em atraso", listaVencidos, "listaV", "v")}
        </div>
      `;
    }

    function renderFinanceiro() {
      const receitaBruta = pagos.length * VALOR_MENSAL;
      const clientesPagos = pagos.length;
      const clientesEmRisco = clientes.filter(c => !isPago(c.id) && c.status === "vencido").length;
      const receitaRisco = clientesEmRisco * VALOR_MENSAL;

      app.innerHTML = `
        <div class="topbar">
          <div>
            <h2>Financeiro</h2>
            <p>Alimentado sempre que um cliente é marcado como pago.</p>
          </div>
          <button class="btn btn-dark" onclick="carregar(true)">Atualizar agora</button>
        </div>

        <div class="grid cards">
          <div class="card"><div class="card-title">Mensalidade base</div><div class="card-value">R$ ${VALOR_MENSAL.toFixed(2).replace(".", ",")}</div></div>
          <div class="card"><div class="card-title">Clientes pagos no mês</div><div class="card-value">${clientesPagos}</div></div>
          <div class="card"><div class="card-title">Receita total bruta</div><div class="card-value">R$ ${receitaBruta.toFixed(2).replace(".", ",")}</div></div>
          <div class="card"><div class="card-title">Receita em risco</div><div class="card-value">R$ ${receitaRisco.toFixed(2).replace(".", ",")}</div></div>
        </div>
      `;
    }

    function renderPromocao() {
      app.innerHTML = `
        <div class="topbar">
          <div>
            <h2>Promoção do dia</h2>
            <p>Escreva a mensagem e envie para os clientes com WhatsApp cadastrado.</p>
          </div>
          <button class="btn btn-dark" onclick="carregar(true)">Atualizar agora</button>
        </div>

        <div class="promo-box">
          <textarea id="promoMsg" placeholder="Ex: Hoje a MS TV está com condição especial de renovação..."></textarea>
          <br><br>
          <button class="btn btn-green" onclick="enviarPromocaoMassa()">Enviar para todos os clientes com número</button>
        </div>
      `;
    }

    function renderSorteio() {
      const elegiveis = clientesEmDiaParaSorteio();

      app.innerHTML = `
        <div class="topbar">
          <div>
            <h2>Sorteio do mês</h2>
            <p>Participam clientes marcados como pagos antes ou até o vencimento.</p>
          </div>
          <button class="btn btn-dark" onclick="carregar(true)">Atualizar agora</button>
        </div>

        <div class="raffle-box">
          <div class="small-card"><strong>Clientes elegíveis:</strong> ${elegiveis.length}</div>
          <button class="btn btn-green" onclick="sortearCliente()">Rodar sorteio</button>
          <div id="raffleResult" class="result-box">Clique no botão para realizar o sorteio.</div>
        </div>
      `;
    }

    function render() {
      if (screen === "dashboard") return renderDashboard();
      if (screen === "clientes") return renderClientes();
      if (screen === "cobrancas") return renderCobrancas();
      if (screen === "financeiro") return renderFinanceiro();
      if (screen === "promocao") return renderPromocao();
      if (screen === "sorteio") return renderSorteio();
    }

    carregar(true);
  </script>
</body>
</html>
