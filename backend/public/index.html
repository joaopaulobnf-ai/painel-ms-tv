<body>
  <div id="root"></div>

  <script>
    const API = window.location.origin;
    const VALOR_MENSAL = 30;

    let screen = "dashboard";
    let clientes = [];
    let pagos = [];
    let renovados = [];
    let contatos = {};
    let observacoes = {};
    let filtroBusca = "";
    let filtroStatus = "";
    let editandoContato = {};
    let currentUser = null;

    function authHeaders() {
      const token = localStorage.getItem("ms_tv_token");
      return token ? { Authorization: "Bearer " + token } : {};
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          ...authHeaders()
        }
      });

      if (res.status === 401) {
        localStorage.removeItem("ms_tv_token");
        currentUser = null;
        renderLogin();
        throw new Error("Sessão expirada");
      }

      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || "Falha na requisição");
      }

      return res.json();
    }

    function parseBrDate(dateStr) {
      const match = String(dateStr || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!match) return null;
      const [, dd, mm, yyyy] = match;
      return new Date(Number(yyyy), Number(mm) - 1, Number(dd), 12, 0, 0);
    }

    function diffDays(dateStr) {
      const d = parseBrDate(dateStr);
      if (!d) return null;
      const now = new Date();
      const startA = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const startB = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.floor((startA - startB) / (1000 * 60 * 60 * 24));
    }

    function isPago(id) {
      return pagos.includes(id);
    }

    function isRenovado(id) {
      return renovados.includes(id);
    }

    function clientesVisiveisClientesCobrancas() {
      return clientes.filter(c => !isRenovado(c.id));
    }

    function statusLabel(cliente) {
      if (isPago(cliente.id) && isRenovado(cliente.id)) return "Pago/Renovado";
      if (isPago(cliente.id)) return "Pago";
      if (isRenovado(cliente.id)) return "Renovado";
      if (cliente.status === "ativo") return "Ativo";
      if (cliente.status === "teste") return "Teste";
      if (cliente.status === "vencido") return "Vencido";
      return "Inativo";
    }

    function statusClass(cliente) {
      if (isPago(cliente.id)) return "badge badge-pago";
      if (isRenovado(cliente.id)) return "badge badge-renovado";
      if (cliente.status === "ativo") return "badge badge-ativo";
      if (cliente.status === "teste") return "badge badge-teste";
      return "badge badge-vencido";
    }

    function sortClientes(lista) {
      return [...lista].sort((a, b) => {
        const da = parseBrDate(a.vencimento);
        const db = parseBrDate(b.vencimento);

        if (!da && !db) return String(a.login || "").localeCompare(String(b.login || ""));
        if (!da) return 1;
        if (!db) return -1;
        return da - db;
      });
    }

    function clientesFiltrados() {
      let lista = sortClientes(clientesVisiveisClientesCobrancas());

      if (filtroBusca.trim()) {
        const q = filtroBusca.trim().toLowerCase();
        lista = lista.filter(c => String(c.login || "").toLowerCase().includes(q));
      }

      if (filtroStatus === "pago") {
        lista = lista.filter(c => isPago(c.id));
      } else if (filtroStatus) {
        lista = lista.filter(c => !isPago(c.id) && c.status === filtroStatus);
      }

      return lista;
    }

    function clientesPorDias(days) {
  return sortClientes(clientesVisiveisClientesCobrancas()).filter(c => {
    const dias = diffDays(c.vencimento);
    return dias === days && !isPago(c.id);
  });
}

   function clientesVencidos() {
  return sortClientes(clientesVisiveisClientesCobrancas()).filter(c => {
    const dias = diffDays(c.vencimento);
    return dias !== null && dias < 0 && !isPago(c.id);
  });
}

    function clientesElegiveisSorteio() {
      return clientes.filter(c => isPago(c.id) || isRenovado(c.id));
    }

    async function checkSession() {
      const token = localStorage.getItem("ms_tv_token");
      if (!token) {
        renderLogin();
        return;
      }

      try {
        const data = await fetchJson(API + "/api/auth/me");
        currentUser = data.username;
        renderAppShell();
        await carregar();
      } catch (error) {
        console.error(error);
        renderLogin();
      }
    }

    async function login(event) {
      event.preventDefault();
      const username = document.getElementById("loginUser").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      const errorBox = document.getElementById("loginError");

      try {
        const data = await fetchJson(API + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        localStorage.setItem("ms_tv_token", data.token);
        currentUser = data.username;
        renderAppShell();
        await carregar();
      } catch (error) {
        console.error(error);
        errorBox.style.display = "block";
        errorBox.textContent = "Usuário ou senha inválidos.";
      }
    }

    async function logout() {
      try {
        await fetchJson(API + "/api/auth/logout", { method: "POST" });
      } catch (error) {
        console.error(error);
      }

      localStorage.removeItem("ms_tv_token");
      currentUser = null;
      renderLogin();
    }

    function renderLogin() {
      document.getElementById("root").innerHTML = `
        <div class="login-screen">
          <div class="login-card">
            <div class="login-avatar">
              <img src="/avatar-ms-tv.png" alt="MS TV">
            </div>
            <h1>MS TV</h1>
            <p>Acesse o painel administrativo com seu usuário e senha.</p>
            <form onsubmit="login(event)">
              <input id="loginUser" placeholder="Usuário" autocomplete="username">
              <div style="height:10px"></div>
              <input id="loginPass" type="password" placeholder="Senha" autocomplete="current-password">
              <div style="height:12px"></div>
              <button class="btn btn-dark" type="submit" style="width:100%">Entrar no painel</button>
            </form>
            <div id="loginError" class="login-error"></div>
          </div>
        </div>
      `;
    }

    function renderAppShell() {
      document.getElementById("root").innerHTML = `
        <div class="layout">
          <aside class="sidebar">
            <div class="avatar-box">
              <div class="avatar-frame">
                <img src="/avatar-ms-tv.png" alt="Avatar MS TV">
              </div>
            </div>

            <div class="brand">
              <h1>MS TV</h1>
              <p>Painel de clientes, cobranças, promoções e sorteio mensal.</p>
            </div>

            <button class="nav-btn ${screen === "dashboard" ? "active" : ""}" onclick="changeScreen('dashboard', this)">📊 Dashboard</button>
            <button class="nav-btn ${screen === "clientes" ? "active" : ""}" onclick="changeScreen('clientes', this)">👥 Clientes</button>
            <button class="nav-btn ${screen === "cobrancas" ? "active" : ""}" onclick="changeScreen('cobrancas', this)">💬 Cobranças WhatsApp</button>
            <button class="nav-btn ${screen === "financeiro" ? "active" : ""}" onclick="changeScreen('financeiro', this)">💰 Financeiro</button>
            <button class="nav-btn ${screen === "promocao" ? "active" : ""}" onclick="changeScreen('promocao', this)">🎁 Promoção do dia</button>
            <button class="nav-btn ${screen === "sorteio" ? "active" : ""}" onclick="changeScreen('sorteio', this)">🎉 Sorteio do mês</button>
            <button class="nav-btn ${screen === "importar" ? "active" : ""}" onclick="changeScreen('importar', this)">📥 Importar lista manual</button>
            <button class="nav-btn ${screen === "listas" ? "active" : ""}" onclick="changeScreen('listas', this)">🗂️ Lista de clientes</button>

            <div class="sidebar-footer">
              WhatsApp oficial da MS TV:<br>
              <strong>(62) 9 9113-3110</strong>
            </div>
          </aside>

          <main class="main">
            <div id="app"></div>
          </main>
        </div>
      `;
    }

    function changeScreen(nextScreen, button) {
      screen = nextScreen;
      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
      if (button) button.classList.add("active");
      function exportarClientesCSV() {
  const lista = clientesFiltrados();

  if (!lista.length) {
    alert("Nenhum cliente para exportar.");
    return;
  }

  const linhas = [
    ["Usuário", "Vencimento", "Status", "Observação", "WhatsApp", "Pago", "Renovado"]
  ];

  lista.forEach(c => {
    linhas.push([
      c.login || "",
      c.vencimento || "",
      statusLabel(c),
      observacoes[c.id] || "",
      contatos[c.id] || "",
      isPago(c.id) ? "SIM" : "NÃO",
      isRenovado(c.id) ? "SIM" : "NÃO"
    ]);
  });

  const csv = linhas
    .map(linha =>
      linha.map(valor => `"${String(valor).replace(/"/g, '""')}"`).join(";")
    )
    .join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const hoje = new Date();
  const nome = `clientes-ms-tv-${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}-${String(hoje.getDate()).padStart(2, "0")}.csv`;

  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function imprimirClientes() {
  const lista = clientesFiltrados();

  if (!lista.length) {
    alert("Nenhum cliente para imprimir.");
    return;
  }

  const html = `

          th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 12px; }
          th { background: #0f172a; color: #fff; }
        </style>
      </head>
      <body>

                      <td><span class="${statusClass(c)}">${statusLabel(c)}</span></td>
                      <td>
                        <div class="obs-box">
                          <span class="obs-label">Observação</span>
                          ${
                            obsSalva
                              ? `
                                <div class="row">
                                  <div class="saved-phone">${escapeHtml(obsSalva)}</div>
                                  <button class="mini-btn mini-gray" onclick="document.getElementById('${obsId}_box').style.display='flex';document.getElementById('${obsId}_saved').style.display='none';">Editar</button>
                                </div>
                                <div id="${obsId}_saved"></div>
                                <div id="${obsId}_box" class="row" style="display:none;margin-top:8px">
                                  <input id="${obsId}" value="${escapeAttr(obsSalva)}" placeholder="Digite uma observação">
                                  <button class="mini-btn mini-green" onclick='salvarObservacao(${safeId})'>Salvar</button>
                                </div>
                              `
                              : `
                                <div class="row">
                                  <input id="${obsId}" value="" placeholder="Digite uma observação">
                                  <button class="mini-btn mini-green" onclick='salvarObservacao(${safeId})'>Salvar</button>
                                </div>
                              `
                          }
                        </div>
                      </td>
                      <td>
                        <div class="table-actions">
                          <div class="contact-box">
                            <span class="contact-label">WhatsApp do cliente</span>
                            ${
                              contatos[c.id] && !editandoContato[c.id]
                                ? `
                                  <div class="row">
                                    <div class="saved-phone">${escapeHtml(contatos[c.id])}</div>
                                    <button class="mini-btn mini-gray" onclick='abrirEdicaoContato(${safeId})'>Editar</button>
                                    <button class="mini-btn mini-red" onclick='removerContato(${safeId})'>Excluir</button>
                                  </div>
                                `
                                : `
                                  <div class="row">
                                    <input id="${inputId}" placeholder="Ex: 62999999999" value="${escapeAttr(contatos[c.id] || "")}">
                                    <button class="mini-btn mini-green" onclick='salvarContato(${safeId})'>Salvar</button>
                                    ${
                                      contatos[c.id]
                                        ? `<button class="mini-btn mini-outline" onclick='cancelarEdicaoContato(${safeId})'>Cancelar</button>`
                                        : ""
                                    }
                                  </div>
                                `
                            }
                          </div>

                          <div class="row">
                            <a
                              class="mini-btn mini-outline"
                              target="_blank"
                              href="${contatos[c.id] ? buildClientWhatsappLink(c, `Olá, tudo bem? Sua assinatura MS TV (${c.login}) vence em ${c.vencimento}. Caso queira, posso te enviar o PIX para renovação.`) : '#'}"
                              onclick="${contatos[c.id] ? "" : "alert('Cadastre o WhatsApp do cliente primeiro.'); return false;"}"
                            >
                              WhatsApp
                            </a>

                            <button class="mini-btn mini-outline" onclick='marcarRenovado(${safeId})'>Renovado</button>

                            ${
                              isPago(c.id)
                                ? `<button class="mini-btn mini-green" onclick='desmarcarPago(${safeId})'>Pago</button>`
                                : `<button class="mini-btn mini-blue" onclick='marcarPago(${safeId})'>Pago</button>`
                            }
                          </div>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join("")
                : `<tr><td colspan="5" class="empty">Nenhum cliente encontrado.</td></tr>`
            }
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById("searchInput").addEventListener("input", e => {
    filtroBusca = e.target.value;
    renderClientes();
  });

  document.getElementById("statusSelect").addEventListener("change", e => {
    filtroStatus = e.target.value;
    renderClientes();
  });
}

              <button class="btn btn-green" onclick='cobrarLista(${JSON.stringify(b.lista)}, "${b.tipo}")'>Enviar cobrança</button>
              <div style="margin-top:14px">
                ${
                  b.lista.length
                    ? b.lista.map(c => `
                      <div class="charge-item">

                        <div style="color:var(--muted)">Vencimento: ${escapeHtml(c.vencimento || "-")}</div>

  }).length;
  const renovadosTotal = renovados.length;

      document.getElementById("app").innerHTML = `
        <div class="topbar">

            <p>Receita soma apenas os clientes marcados como pago.</p>

    async function renderListasHistorico() {
      const listas = await carregarListasHistorico();

      document.getElementById("app").innerHTML = `
        <div class="topbar">
          <div>
            <h2>Lista de clientes</h2>
            <p>Meses importados manualmente.</p>
          </div>

            <button class="btn btn-red" onclick="logout()">Sair</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-top:0">Subpastas mensais</h3>
          ${
            listas.length
              ? `
                <div class="folder-grid">
                  ${listas.map(item => `
                    <div class="folder-card" onclick='abrirResumoMes(${JSON.stringify(item.mes)})'>
                      📁 ${escapeHtml(item.label)}

                  `).join("")}
                </div>

                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Mês</th>
                        <th>Clientes</th>
                        <th>Renovações</th>
                        <th>Vencidos</th>
                        <th>Testes</th>
                        <th>Bruto</th>
                        <th>Ações</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${listas.map(item => `
                        <tr>
                          <td>${escapeHtml(item.label)}</td>
                          <td>${item.resumo.totalClientes}</td>
                          <td>${item.resumo.renovacoes}</td>
                          <td>${item.resumo.vencidos}</td>
                          <td>${item.resumo.testesGerados}</td>
                          <td>R$ ${Number(item.resumo.dinheiroBruto || 0).toFixed(2).replace(".", ",")}</td>
                          <td><button class="mini-btn mini-blue" onclick='abrirResumoMes(${JSON.stringify(item.mes)})'>Abrir resumo</button></td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              `
              : `<div class="empty">Nenhuma subpasta mensal foi criada ainda.</div>`
          }
        </div>
      `;
    }

    function render() {
      if (screen === "dashboard") return renderDashboard();
      if (screen === "clientes") return renderClientes();
      if (screen === "cobrancas") return renderCobrancas();
      if (screen === "financeiro") return renderFinanceiro();
      if (screen === "promocao") return renderPromocao();
      if (screen === "sorteio") return renderSorteio();
      if (screen === "importar") return renderImportar();
      if (screen === "listas") return renderListasHistorico();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function cssSafeId(value) {
      return String(value ?? "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    checkSession();
  </script>
