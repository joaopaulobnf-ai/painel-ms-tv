<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MS TV Admin</title>

<style>
body { font-family: Arial; margin:0; display:flex; }
.sidebar { width:220px; background:#111; color:#fff; padding:20px;}
.sidebar button { width:100%; margin:5px 0; padding:10px; cursor:pointer;}
.main { flex:1; padding:20px;}

.card { background:#f3f3f3; padding:15px; margin:10px 0; border-radius:10px;}
.btn { padding:6px 10px; cursor:pointer; border:none; border-radius:6px;}
.green { background:#2ecc71; color:#fff;}
.blue { background:#3498db; color:#fff;}
.red { background:#e74c3c; color:#fff;}
</style>
</head>

<body>

<div class="sidebar">
  <h2>MS TV</h2>
  <button onclick="screen='dashboard';render()">Dashboard</button>
  <button onclick="screen='clientes';render()">Clientes</button>
  <button onclick="screen='cobrancas';render()">Cobranças</button>
  <button onclick="screen='financeiro';render()">Financeiro</button>
  <button onclick="screen='promocao';render()">Promoção</button>
  <button onclick="screen='sorteio';render()">Sorteio</button>
</div>

<div class="main" id="app"></div>

<script>
let screen = "dashboard";
let clientes = [];
let pagos = [];

const API = "";

// ================= FETCH =================

async function carregar() {
  const res = await fetch(API + "/api/clients/sync");
  const data = await res.json();
  clientes = data.clients;

  const pagosRes = await fetch(API + "/api/clients/pagos");
  pagos = await pagosRes.json();

  render();
}

// ================= RENDER =================

function render() {
  if (screen === "dashboard") renderDashboard();
  if (screen === "clientes") renderClientes();
  if (screen === "cobrancas") renderCobrancas();
  if (screen === "financeiro") renderFinanceiro();
  if (screen === "promocao") renderPromocao();
  if (screen === "sorteio") renderSorteio();
}

// ================= DASHBOARD =================

function renderDashboard() {
  app.innerHTML = `
    <h1>Dashboard</h1>
    <div class="card">Clientes: ${clientes.length}</div>
  `;
}

// ================= CLIENTES =================

function renderClientes() {
  app.innerHTML = "<h2>Clientes</h2>";

  clientes
    .sort((a,b)=> new Date(a.vencimentoIso)-new Date(b.vencimentoIso))
    .forEach(c => {

      const pago = pagos.includes(c.id);

      app.innerHTML += `
        <div class="card">
          ${c.login} - ${c.vencimento}
          ${pago ? "(Pago)" : ""}
          <button class="btn blue" onclick="pagar('${c.id}')">Pagar</button>
        </div>
      `;
    });
}

async function pagar(id) {
  await fetch(API + "/api/clients/pagar/" + id, {method:"POST"});
  carregar();
}

// ================= COBRANÇAS =================

function renderCobrancas() {
  app.innerHTML = "<h2>Cobranças</h2>";

  clientes.forEach(c => {
    app.innerHTML += `
      <div class="card">
        ${c.login} - ${c.vencimento}
        <button class="btn green" onclick="whats('${c.login}')">WhatsApp</button>
      </div>
    `;
  });
}

function whats(login) {
  const msg = encodeURIComponent(
    `Olá ${login}, sua mensalidade está próxima do vencimento.`
  );

  window.open(`https://wa.me/5562991133110?text=${msg}`);
}

// ================= FINANCEIRO =================

function renderFinanceiro() {
  const total = pagos.length * 30;

  app.innerHTML = `
    <h2>Financeiro</h2>
    <div class="card">Total recebido: R$ ${total}</div>
  `;
}

// ================= PROMOÇÃO =================

function renderPromocao() {
  app.innerHTML = `
    <h2>Promoção</h2>
    <textarea id="msg" style="width:100%;height:100px;"></textarea>
    <br><br>
    <button class="btn green" onclick="enviarPromo()">Enviar</button>
  `;
}

function enviarPromo() {
  const msg = document.getElementById("msg").value;

  clientes.forEach(c => {
    const texto = encodeURIComponent(msg.replace("{login}", c.login));
    window.open(`https://wa.me/5562991133110?text=${texto}`);
  });
}

// ================= SORTEIO =================

function renderSorteio() {
  app.innerHTML = `
    <h2>Sorteio</h2>
    <button class="btn green" onclick="sortear()">Sortear</button>
    <div id="resultado"></div>
  `;
}

function sortear() {
  const lista = clientes.filter(c => pagos.includes(c.id));
  const sorteado = lista[Math.floor(Math.random()*lista.length)];

  document.getElementById("resultado").innerHTML =
    "Ganhador: " + (sorteado ? sorteado.login : "Ninguém");
}

// ================= INIT =================

carregar();
</script>

</body>
</html>
